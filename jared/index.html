    <meta name="theme-color" content="#0d1f3c" />

    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />

    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#grid">Skip to products</a>

    <header class="masthead">
      <div class="masthead__brand">
        <!-- The Em wordmark, drawn on the same grid as the favicon. It is
             decorative here because the title beside it says the same thing,
             and it inherits the band's white through currentColor. Shown only
             on the list that sets "wordmark" in its products.js. -->
        <svg
          class="masthead__mark"
          id="collection-mark"
          viewBox="17 217 290 166"
          aria-hidden="true"
          focusable="false"
          hidden
        >
          <g fill="currentColor">
            <circle cx="28" cy="228" r="11" />
            <circle cx="64" cy="228" r="11" />
            <circle cx="100" cy="228" r="11" />
            <circle cx="28" cy="264" r="11" />
            <circle cx="28" cy="300" r="11" />
            <circle cx="64" cy="300" r="11" />
            <circle cx="100" cy="300" r="11" />
            <circle cx="28" cy="336" r="11" />
            <circle cx="28" cy="372" r="11" />
            <circle cx="64" cy="372" r="11" />
            <circle cx="100" cy="372" r="11" />
            <circle cx="152" cy="300" r="11" />
            <circle cx="188" cy="300" r="11" />
            <circle cx="224" cy="300" r="11" />
            <circle cx="260" cy="300" r="11" />
            <circle cx="296" cy="300" r="11" />
            <circle cx="152" cy="336" r="11" />
            <circle cx="224" cy="336" r="11" />
            <circle cx="296" cy="336" r="11" />
            <circle cx="152" cy="372" r="11" />
            <circle cx="224" cy="372" r="11" />
            <circle cx="296" cy="372" r="11" />
          </g>
        </svg>
        <h1 class="masthead__title" id="collection-title">&nbsp;</h1>
      </div>
      <nav class="masthead__nav" aria-label="Views">
        <a class="nav-link" id="nav-all" href="#all">All</a>
        <a class="nav-link" id="nav-saved" href="#saved"
          >Saved<span class="nav-link__count" id="saved-count" hidden></span
        ></a>
      </nav>
    </header>

    <main>
      <p class="feedback" id="empty-message" hidden>No saved pieces yet.</p>
      <div class="grid" id="grid"></div>
    </main>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <template id="product-template">
      <article class="product">
        <div class="product__media">
          <img
            class="product__image"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
        </div>
        <div class="product__info">
          <div class="product__text">
            <p class="product__brand">
              <img
                class="product__logo"
                alt=""
                hidden
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
              />
              <span class="product__brandname"></span>
            </p>
            <h2 class="product__name">
              <a
                class="product__link"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </h2>
            <p class="product__price"></p>
            <p class="product__meta"></p>
            <p class="product__colors" hidden></p>
            <p class="product__note"></p>
          </div>
          <button class="product__save" type="button" aria-pressed="false">
            <svg
              class="product__heart"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 20.7 3.9 12.9a5.1 5.1 0 0 1 0-7.3 5.1 5.1 0 0 1 7.2 0l.9.9.9-.9a5.1 5.1 0 0 1 7.2 0 5.1 5.1 0 0 1 0 7.3Z"
              />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="products.js"></script>
    <script src="../app.js"></script>
