<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Em's Dress Code</title>
    <meta
      name="description"
      content="A curated list of pieces from many stores in one place. Tap a product to shop it, tap the heart to save it."
    />
    <meta name="theme-color" content="#0d1f3c" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <!-- Em's wordmark on a navy tile, the same drawing as the mark on the band.
         Inline so it needs no file and reads on both a light and a dark
         browser tab. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-18 120 360 360'%3E%3Crect x='-18' y='120' width='360' height='360' fill='%230d1f3c'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='28' cy='228' r='11'/%3E%3Ccircle cx='64' cy='228' r='11'/%3E%3Ccircle cx='100' cy='228' r='11'/%3E%3Ccircle cx='28' cy='264' r='11'/%3E%3Ccircle cx='28' cy='300' r='11'/%3E%3Ccircle cx='64' cy='300' r='11'/%3E%3Ccircle cx='100' cy='300' r='11'/%3E%3Ccircle cx='28' cy='336' r='11'/%3E%3Ccircle cx='28' cy='372' r='11'/%3E%3Ccircle cx='64' cy='372' r='11'/%3E%3Ccircle cx='100' cy='372' r='11'/%3E%3Ccircle cx='152' cy='300' r='11'/%3E%3Ccircle cx='188' cy='300' r='11'/%3E%3Ccircle cx='224' cy='300' r='11'/%3E%3Ccircle cx='260' cy='300' r='11'/%3E%3Ccircle cx='296' cy='300' r='11'/%3E%3Ccircle cx='152' cy='336' r='11'/%3E%3Ccircle cx='224' cy='336' r='11'/%3E%3Ccircle cx='296' cy='336' r='11'/%3E%3Ccircle cx='152' cy='372' r='11'/%3E%3Ccircle cx='224' cy='372' r='11'/%3E%3Ccircle cx='296' cy='372' r='11'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20260816011617" />
  </head>
  <body>
    <a class="skip-link" href="#grid">Skip to products</a>

    <header class="masthead">
      <h1 class="masthead__title" id="collection-title">&nbsp;</h1>
      <!-- Em's wordmark, the same drawing as the favicon without its navy tile,
           since the band already supplies the navy. Decorative, because the
           title says the name in words. Shown only on the list that sets
           "wordmark" in its products.js. -->
      <svg
        class="masthead__mark"
        id="collection-mark"
        viewBox="17 217 290 166"
        aria-hidden="true"
        focusable="false"
        hidden
      >
        <g fill="currentColor">
          <circle cx="28" cy="228" r="11" />
          <circle cx="64" cy="228" r="11" />
          <circle cx="100" cy="228" r="11" />
          <circle cx="28" cy="264" r="11" />
          <circle cx="28" cy="300" r="11" />
          <circle cx="64" cy="300" r="11" />
          <circle cx="100" cy="300" r="11" />
          <circle cx="28" cy="336" r="11" />
          <circle cx="28" cy="372" r="11" />
          <circle cx="64" cy="372" r="11" />
          <circle cx="100" cy="372" r="11" />
          <circle cx="152" cy="300" r="11" />
          <circle cx="188" cy="300" r="11" />
          <circle cx="224" cy="300" r="11" />
          <circle cx="260" cy="300" r="11" />
          <circle cx="296" cy="300" r="11" />
          <circle cx="152" cy="336" r="11" />
          <circle cx="224" cy="336" r="11" />
          <circle cx="296" cy="336" r="11" />
          <circle cx="152" cy="372" r="11" />
          <circle cx="224" cy="372" r="11" />
          <circle cx="296" cy="372" r="11" />
        </g>
      </svg>
    </header>

    <main>
      <div class="toolbar">
        <div class="toolbar__start">
          <button
            class="filters-toggle"
            id="filters-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="filters"
          >
            <svg
              class="filters-toggle__icon"
              viewBox="0 0 16 12"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="0" y="0" width="16" height="1.6" />
              <rect x="0" y="5.2" width="16" height="1.6" />
              <rect x="0" y="10.4" width="16" height="1.6" />
            </svg>
            Filters<span
              class="filters-toggle__count"
              id="filters-count"
              hidden
            ></span>
          </button>

          <nav class="views" aria-label="Views">
            <a class="nav-link" id="nav-all" href="#all">All</a>
            <a class="nav-link" id="nav-saved" href="#saved"
              >Saved<span class="nav-link__count" id="saved-count" hidden></span
            ></a>
          </nav>
        </div>

        <!-- Density sits where the count used to. It only changes anything on
             a wide screen, so it is hidden below the breakpoint that gives the
             grid a choice of columns. -->
        <div class="density" id="density" role="group" aria-label="Per row">
          <button class="density__button" type="button" data-cols="2">2</button>
          <button class="density__button" type="button" data-cols="3">3</button>
          <button class="density__button" type="button" data-cols="4">4</button>
        </div>
      </div>

      <p class="feedback" id="empty-message" hidden>No saved pieces yet.</p>
      <div class="grid" id="grid" data-cols="4"></div>

      <nav class="pager" id="pager" aria-label="Pages" hidden>
        <button class="pager__button" id="pager-prev" type="button">
          Previous
        </button>
        <p class="pager__status" id="pager-status" aria-live="polite"></p>
        <button class="pager__button" id="pager-next" type="button">
          Next
        </button>
      </nav>

      <p class="result-count" id="result-count"></p>
    </main>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- The filter panel slides in over the page rather than pushing it down,
         so the grid keeps its place while the visitor narrows things. -->
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside class="drawer" id="filters" aria-label="Filters" hidden>
      <div class="drawer__head">
        <p class="drawer__title">Filters</p>
        <button class="drawer__close" id="drawer-close" type="button">
          Close
        </button>
      </div>

      <div class="drawer__body">
        <fieldset class="facet">
          <legend class="facet__title">Brand</legend>
          <div class="facet__options" id="facet-brand"></div>
        </fieldset>

        <fieldset class="facet">
          <legend class="facet__title">Type</legend>
          <div class="facet__options" id="facet-type"></div>
        </fieldset>

        <fieldset class="facet">
          <legend class="facet__title">Colour</legend>
          <div class="facet__options" id="facet-color"></div>
        </fieldset>

        <div class="facet">
          <label class="facet__title" for="sort-by">Sort</label>
          <select class="drawer__select" id="sort-by">
            <option value="curated">Curated</option>
            <option value="price-asc">Price low to high</option>
            <option value="price-desc">Price high to low</option>
          </select>
        </div>
      </div>

      <div class="drawer__foot">
        <button class="drawer__clear" id="filters-clear" type="button">
          Clear all
        </button>
      </div>
    </aside>

    <template id="product-template">
      <article class="product">
        <div class="product__media">
          <img
            class="product__image"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
        </div>
        <div class="product__info">
          <div class="product__text">
            <p class="product__brand">
              <img
                class="product__logo"
                alt=""
                hidden
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
              />
              <span class="product__brandname"></span>
            </p>
            <h2 class="product__name">
              <a
                class="product__link"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </h2>
            <p class="product__original"></p>
            <p class="product__price">
              <span class="visually-hidden product__approx-word"></span
              ><span class="product__approx" aria-hidden="true"></span
              ><span class="product__price-value"></span>
            </p>
            <p class="product__price-original"></p>
            <p class="product__meta"></p>
            <p class="product__colors" hidden></p>
            <p class="product__note"></p>
          </div>
          <button class="product__save" type="button" aria-pressed="false">
            <svg
              class="product__heart"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 20.7 3.9 12.9a5.1 5.1 0 0 1 0-7.3 5.1 5.1 0 0 1 7.2 0l.9.9.9-.9a5.1 5.1 0 0 1 7.2 0 5.1 5.1 0 0 1 0 7.3Z"
              />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="products.js?v=20260816011617"></script>
    <script src="app.js?v=20260816011617"></script>
  </body>
</html>
