<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Em's Dress Code</title>
    <meta
      name="description"
      content="A short curated list of pieces. Tap a product to shop it, tap the heart to save it."
    />
    <meta name="theme-color" content="#0d1f3c" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <!-- The EDC monogram on a navy tile, the same drawing as the masthead
         mark. Inline so it needs no file and reads on both a light and a dark
         browser tab. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-22 70 460 460'%3E%3Crect x='-22' y='70' width='460' height='460' fill='%230d1f3c'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='28' cy='228' r='11'/%3E%3Ccircle cx='64' cy='228' r='11'/%3E%3Ccircle cx='100' cy='228' r='11'/%3E%3Ccircle cx='28' cy='264' r='11'/%3E%3Ccircle cx='28' cy='300' r='11'/%3E%3Ccircle cx='64' cy='300' r='11'/%3E%3Ccircle cx='100' cy='300' r='11'/%3E%3Ccircle cx='28' cy='336' r='11'/%3E%3Ccircle cx='28' cy='372' r='11'/%3E%3Ccircle cx='64' cy='372' r='11'/%3E%3Ccircle cx='100' cy='372' r='11'/%3E%3Ccircle cx='172' cy='228' r='11'/%3E%3Ccircle cx='208' cy='228' r='11'/%3E%3Ccircle cx='172' cy='264' r='11'/%3E%3Ccircle cx='244' cy='264' r='11'/%3E%3Ccircle cx='172' cy='300' r='11'/%3E%3Ccircle cx='244' cy='300' r='11'/%3E%3Ccircle cx='172' cy='336' r='11'/%3E%3Ccircle cx='244' cy='336' r='11'/%3E%3Ccircle cx='172' cy='372' r='11'/%3E%3Ccircle cx='208' cy='372' r='11'/%3E%3Ccircle cx='316' cy='228' r='11'/%3E%3Ccircle cx='352' cy='228' r='11'/%3E%3Ccircle cx='388' cy='228' r='11'/%3E%3Ccircle cx='316' cy='264' r='11'/%3E%3Ccircle cx='316' cy='300' r='11'/%3E%3Ccircle cx='316' cy='336' r='11'/%3E%3Ccircle cx='316' cy='372' r='11'/%3E%3Ccircle cx='352' cy='372' r='11'/%3E%3Ccircle cx='388' cy='372' r='11'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#grid">Skip to products</a>

    <header class="masthead">
      <div class="masthead__brand">
        <!-- The EDC monogram, on the same 36px grid and 11px dots as Em's
             original artwork, so it sits on the same rhythm. This is the same
             drawing as the favicon, minus the navy tile, because the band
             already supplies the navy. Decorative here, since the title beside
             it says the name in words. Shown only on the list that sets
             "wordmark" in its products.js. -->
        <svg
          class="masthead__mark"
          id="collection-mark"
          viewBox="17 217 382 166"
          aria-hidden="true"
          focusable="false"
          hidden
        >
          <g fill="currentColor">
            <circle cx="28" cy="228" r="11" />
            <circle cx="64" cy="228" r="11" />
            <circle cx="100" cy="228" r="11" />
            <circle cx="28" cy="264" r="11" />
            <circle cx="28" cy="300" r="11" />
            <circle cx="64" cy="300" r="11" />
            <circle cx="100" cy="300" r="11" />
            <circle cx="28" cy="336" r="11" />
            <circle cx="28" cy="372" r="11" />
            <circle cx="64" cy="372" r="11" />
            <circle cx="100" cy="372" r="11" />
            <circle cx="172" cy="228" r="11" />
            <circle cx="208" cy="228" r="11" />
            <circle cx="172" cy="264" r="11" />
            <circle cx="244" cy="264" r="11" />
            <circle cx="172" cy="300" r="11" />
            <circle cx="244" cy="300" r="11" />
            <circle cx="172" cy="336" r="11" />
            <circle cx="244" cy="336" r="11" />
            <circle cx="172" cy="372" r="11" />
            <circle cx="208" cy="372" r="11" />
            <circle cx="316" cy="228" r="11" />
            <circle cx="352" cy="228" r="11" />
            <circle cx="388" cy="228" r="11" />
            <circle cx="316" cy="264" r="11" />
            <circle cx="316" cy="300" r="11" />
            <circle cx="316" cy="336" r="11" />
            <circle cx="316" cy="372" r="11" />
            <circle cx="352" cy="372" r="11" />
            <circle cx="388" cy="372" r="11" />
          </g>
        </svg>
        <h1 class="masthead__title" id="collection-title">&nbsp;</h1>
      </div>
      <nav class="masthead__nav" aria-label="Views">
        <a class="nav-link" id="nav-all" href="#all">All</a>
        <a class="nav-link" id="nav-saved" href="#saved"
          >Saved<span class="nav-link__count" id="saved-count" hidden></span
        ></a>
      </nav>
    </header>

    <main>
      <div class="controls">
        <div class="controls__filters">
          <div class="controls__group">
            <label class="controls__label" for="filter-brand">Brand</label>
            <select class="controls__select" id="filter-brand"></select>
          </div>
          <div class="controls__group">
            <label class="controls__label" for="filter-color">Colour</label>
            <select class="controls__select" id="filter-color"></select>
          </div>
          <div class="controls__group">
            <label class="controls__label" for="sort-by">Sort</label>
            <select class="controls__select" id="sort-by">
              <option value="curated">Curated</option>
              <option value="price-asc">Price low to high</option>
              <option value="price-desc">Price high to low</option>
            </select>
          </div>
        </div>
        <p class="controls__count" id="result-count"></p>
      </div>

      <p class="feedback" id="empty-message" hidden>No saved pieces yet.</p>
      <div class="grid" id="grid"></div>

      <nav class="pager" id="pager" aria-label="Pages" hidden>
        <button class="pager__button" id="pager-prev" type="button">
          Previous
        </button>
        <p class="pager__status" id="pager-status" aria-live="polite"></p>
        <button class="pager__button" id="pager-next" type="button">
          Next
        </button>
      </nav>
    </main>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <template id="product-template">
      <article class="product">
        <div class="product__media">
          <img
            class="product__image"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
        </div>
        <div class="product__info">
          <div class="product__text">
            <p class="product__brand">
              <img
                class="product__logo"
                alt=""
                hidden
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
              />
              <span class="product__brandname"></span>
            </p>
            <h2 class="product__name">
              <a
                class="product__link"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </h2>
            <p class="product__original"></p>
            <p class="product__price"></p>
            <p class="product__price-original"></p>
            <p class="product__meta"></p>
            <p class="product__colors" hidden></p>
            <p class="product__note"></p>
          </div>
          <button class="product__save" type="button" aria-pressed="false">
            <svg
              class="product__heart"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 20.7 3.9 12.9a5.1 5.1 0 0 1 0-7.3 5.1 5.1 0 0 1 7.2 0l.9.9.9-.9a5.1 5.1 0 0 1 7.2 0 5.1 5.1 0 0 1 0 7.3Z"
              />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="products.js"></script>
    <script src="app.js"></script>
  </body>
</html>
